<!DOCTYPE html>
<html>
<head><title>Todo App</title></head>
<body>
  <h1>Todos</h1>
  <ul id="todo-list"></ul>
  <input id="todo-input" placeholder="New todo"><button onclick="addTodo()">Add</button>
  <script>
    async function fetchTodos() {
      const res = await fetch('/todos');
      const todos = await res.json();
      document.getElementById('todo-list').innerHTML = todos.map(t => `<li>${t.text} <button onclick="deleteTodo(${t.id})">Delete</button></li>`).join('');
    }
    async function addTodo() {
      const text = document.getElementById('todo-input').value;
      await fetch('/todos', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
      fetchTodos();
    }
    async function deleteTodo(id) {
      await fetch(`/todos/${id}`, {method: 'DELETE'});
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
